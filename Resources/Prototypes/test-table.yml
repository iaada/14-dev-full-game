- type: entityTable
  id: TestBudgetTableAll
  table: !type:AllSelector
    childConditions:
    - !type:BudgetRangeCondition
    children: &Children
    - id: TestEntity100
    - id: TestEntity200
    - id: TestEntity300
    - id: TestEntityNoBudget # Logs an error now due to having two budget conditions
      conditions:
      - !type:BudgetRangeCondition
        costOverride: 400
    - id: TestEntityNoBudget # Logs an error

- type: entityTable
  id: TestBudgetTableGroup
  table: !type:GroupSelector
    childConditions:
    - !type:BudgetRangeCondition
    children: *Children

- type: entity
  id: TestEntity100
  components:
  - type: TableBudgetCost
    cost: 100

- type: entity
  id: TestEntity200
  components:
  - type: TableBudgetCost
    cost: 200

- type: entity
  id: TestEntity300
  components:
  - type: TableBudgetCost
    cost: 300

- type: entity
  id: TestEntityNoBudget
